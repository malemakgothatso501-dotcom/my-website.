<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Your shopping cart at Kgothatso Streetwear.">
    <title>Cart | Kgothatso Streetwear</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
	
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <span>K</span> KGOTHATSO
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <a href="cart.html" class="cart">
            🛒 <span>0</span>
        </a>

    </header>


    <!-- Cart Header -->
    <section class="shop-header">

        <p>KGOTHATSO STREETWEAR</p>

        <h1>YOUR CART</h1>

        <span>Review your selected items.</span>

    </section>


    <!-- Cart -->
    <main class="cart-page">

        <div id="cartItems"></div>

        <div class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-line">
                <span>Subtotal</span>
                <strong id="cartTotal">R0.00</strong>
            </div>

            <div class="summary-line">
                <span>Delivery</span>
                <strong>Calculated at checkout</strong>
            </div>

            <a href="checkout.html" class="checkout-button">
			    PROCEED TO checkout
			</a>

            <a href="shop.html" class="continue-shopping">
                ← Continue Shopping
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <h2>KGOTHATSO STREETWEAR</h2>

        <p>Wear Your Identity.</p>

        <p class="copyright">
            © 2026 Kgothatso Streetwear. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
